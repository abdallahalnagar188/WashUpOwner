# PR gates (GAP-055): analyze and unit/widget tests on every pull request and on pushes to main/ebrahim.
# Builds run elsewhere (iOS: Codemagic Workflow Editor; Android: outside CI); this workflow builds nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main, ebrahim]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same Flutter as the customer app's CI, Shorebird and Codemagic pins (GAP-057). Bump them together.
  FLUTTER_VERSION: '3.47.7'

jobs:
  flutter:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true # caches the SDK and the pub cache

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      # Offline: the API is faked (test/helpers/fake_server.dart).
      - name: flutter test
        run: flutter test

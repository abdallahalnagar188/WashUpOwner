workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic Key
    environment:
      flutter: 3.29.0
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.alnagar.washup.owner
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Install pods
        script: cd ios && pod install --repo-update
      - name: Use signing profiles
        script: xcode-project use-profiles
      - name: Test
        script: flutter test
      - name: Build IPA
        script: flutter build ipa --release --no-pub --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
